<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d18"><title>پیام‌رسان | آکادمی شوالیه</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#090e18;--panel:#121d2d;--panel2:#19283d;--line:#2b3b53;--gold:#e8bd5b;--text:#f4f6fb;--muted:#9eacc0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#1b2b43,transparent 40%),var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif}.wrap{max-width:1200px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top b{font-size:18px}.btn{border:0;border-radius:10px;background:var(--gold);color:#171717;padding:10px 14px;font:700 12px Vazirmatn;cursor:pointer}.btn.alt{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.layout{display:grid;grid-template-columns:320px 1fr;gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;min-width:0}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.tab{background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:8px 11px;border-radius:9px;font:inherit;font-size:11px;cursor:pointer}.tab.active{color:var(--gold);border-color:#8d713b}.field{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);font:inherit;font-size:12px;margin:5px 0 10px}.list{display:grid;gap:7px;max-height:60vh;overflow:auto}.person{padding:11px;background:var(--panel2);border:1px solid transparent;border-radius:10px;cursor:pointer}.person.active{border-color:var(--gold)}.person b{font-size:12px}.person small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.role{display:inline-block;color:var(--gold);font-size:9px;border:1px solid #66552e;border-radius:20px;padding:1px 7px;margin-right:5px}.chathead{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:12px}.chathead small{color:var(--muted)}.messages{height:52vh;min-height:300px;overflow:auto;padding:12px 2px}.msg{max-width:82%;padding:9px 12px;border-radius:12px;margin:8px 0;background:#26364e;font-size:12px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}.msg.mine{background:#e8bd5b;color:#172033;margin-right:auto}.msg small{display:block;opacity:.7;font-size:9px}.send{display:flex;gap:8px}.send input{flex:1;min-width:0}.status{font-size:11px;color:var(--gold);line-height:2;margin-top:8px}.hidden{display:none!important}.profilegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.empty{color:var(--muted);font-size:11px;text-align:center;padding:25px}.profilebox{margin-bottom:14px}.profilebox h3{margin:0 0 6px;font-size:14px}.hint{font-size:10px;color:var(--muted);line-height:1.8}@media(max-width:760px){.layout{grid-template-columns:1fr}.list{max-height:240px}.messages{height:42vh}.wrap{padding:12px}.profilegrid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<header class="top"><div><b>♞ پیام‌رسان آکادمی شوالیه</b><div class="hint">گفت‌وگوی خصوصی و گروهی</div></div><button class="btn alt" id="back">بازگشت به پنل</button></header>
<section class="panel profilebox" id="profileBox"><h3>👤 پروفایل من</h3><div class="hint">برای استفاده از پیام‌رسان، این اطلاعات را تکمیل کن. نقش از حساب تأییدشده گرفته می‌شود و قابل تغییر توسط کاربر نیست.</div><form id="profileForm"><div class="profilegrid"><label>نام نمایشی<input class="field" id="displayName" maxlength="60" required></label><label>نام کاربری یکتا<input class="field" id="username" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" placeholder="مثلاً arsin_5" required></label></div><label>بیوگرافی کوتاه<input class="field" id="bio" maxlength="160" placeholder="چند کلمه درباره خودت"></label><label>عکس پروفایل<input class="field" id="avatarFile" type="file" accept="image/*"><span class="hint">از دستگاهت عکس انتخاب کن (حداکثر ۳ مگابایت).</span><img id="avatarPreview" class="hidden" alt="پیش‌نمایش عکس" style="width:76px;height:76px;object-fit:cover;border-radius:50%;border:2px solid var(--gold);margin:6px 0"></label><button class="btn" type="submit">ذخیره پروفایل</button><span class="status" id="profileStatus"></span></form></section>
<div class="layout hidden" id="chatLayout"><aside class="panel"><div class="tabs"><button class="tab active" data-mode="people">افراد</button><button class="tab" data-mode="groups">گروه‌ها</button><button class="tab" data-mode="profile">پروفایل</button></div>
<div id="peoplePane"><input class="field" id="search" placeholder="جست‌وجوی نام یا نام کاربری"><div class="list" id="peopleList"><div class="empty">در حال دریافت کاربران...</div></div></div>
<div id="groupsPane" class="hidden"><button class="btn" id="newGroup">＋ ایجاد گروه</button><div class="list" id="groupList" style="margin-top:10px"></div></div>
<div id="sideProfile" class="hidden"><div class="hint" id="myRole"></div><button class="btn alt" id="editProfile">ویرایش پروفایل</button></div></aside>
<section class="panel"><div class="chathead"><div><b id="chatTitle">یک گفت‌وگو انتخاب کن</b><div><small id="chatSubtitle">پیام‌ها خصوصی هستند.</small></div></div><button class="btn alt hidden" id="groupManage">مدیریت اعضا</button></div><div class="messages" id="messages"><div class="empty">از فهرست افراد یا گروه‌ها یک مورد انتخاب کن.</div></div><form class="send" id="sendForm"><input class="field" id="messageInput" maxlength="2000" placeholder="پیامت را بنویس..." disabled required><button class="btn" id="sendBtn" disabled>ارسال</button></form><div class="status" id="chatStatus"></div></section></div></div>
<script>
const URL="https://rdsermutogewhcdsyoon.supabase.co",KEY="sb_publishable_kybJ2B3BKoT2fScPaz6xRQ_eBOSwiqi",db=supabase.createClient(URL,KEY);
let me=null,role=null,profile=null,selected=null,mode="people",contacts=[],groups=[];
const $=id=>document.getElementById(id), roleFa={student:"دانش‌آموز",teacher:"معلم",admin:"مدیر",creator:"سازنده"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function status(id,t){$(id).textContent=t}
async function boot(){
 const {data:{session}}=await db.auth.getSession();if(!session){location.href="index.html";return}me=session.user;
 const {data:p,error}=await db.from("ka_profiles").select("role,approved").eq("id",me.id).single();
 if(error||!p||p.approved!==true){alert("حساب تأییدشده پیدا نشد.");location.href="index.html";return}role=p.role;
 const {data:cp,error:ce}=await db.from("ka_chat_profiles").select("*").eq("user_id",me.id).maybeSingle();
 if(ce){status("profileStatus","ابتدا مدیر باید فایل تنظیمات پیام‌رسان را در Supabase اجرا کند.");return}
 profile=cp;if(cp?.avatar_url){$("avatarPreview").src=cp.avatar_url;$("avatarPreview").classList.remove("hidden")}const complete=!!(cp?.display_name&&cp?.username);$("chatLayout").classList.toggle("hidden",!complete);if(cp){$("displayName").value=cp.display_name||"";$("username").value=cp.username||"";$("bio").value=cp.bio||""}
 $("myRole").innerHTML="نقش حساب: <b>"+esc(roleFa[role]||role)+"</b><br>نام کاربری: @"+esc(cp?.username||"تکمیل نشده");
 $("profileBox").classList.toggle("hidden",!!(cp?.display_name&&cp?.username));
 await loadPeople();await loadGroups();
}
$("avatarFile").addEventListener("change",()=>{const f=$("avatarFile").files[0];if(!f)return;if(!f.type.startsWith("image/")||f.size>3145728){status("profileStatus","فقط تصویر با حجم حداکثر ۳ مگابایت انتخاب کن.");$("avatarFile").value="";return}$("avatarPreview").src=URL.createObjectURL(f);$("avatarPreview").classList.remove("hidden")});
$("profileForm").addEventListener("submit",async e=>{e.preventDefault();let avatarUrl=profile?.avatar_url||null;const file=$("avatarFile").files[0];if(file){if(!file.type.startsWith("image/")||file.size>3145728){status("profileStatus","حجم عکس باید حداکثر ۳ مگابایت باشد.");return}const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";const path=me.id+"/avatar."+ext;status("profileStatus","در حال بارگذاری عکس...");const {error:upErr}=await db.storage.from("ka-avatars").upload(path,file,{upsert:true,contentType:file.type});if(upErr){status("profileStatus","بارگذاری عکس انجام نشد: "+upErr.message+" — تنظیمات جدید را در Supabase اجرا کن.");return}avatarUrl=db.storage.from("ka-avatars").getPublicUrl(path).data.publicUrl}const row={user_id:me.id,display_name:$("displayName").value.trim(),username:$("username").value.trim().toLowerCase(),bio:$("bio").value.trim(),avatar_url:avatarUrl,updated_at:new Date().toISOString()};if(!/^[a-z0-9_]{3,24}$/.test(row.username)){status("profileStatus","نام کاربری باید ۳ تا ۲۴ حرف انگلیسی، عدد یا زیرخط باشد.");return}const {data,error}=await db.from("ka_chat_profiles").upsert(row,{onConflict:"user_id"}).select().single();if(error){status("profileStatus",error.code==="23505"?"این نام کاربری قبلاً انتخاب شده است.":"ذخیره نشد: "+error.message);return}profile=data;$("profileBox").classList.remove("hidden");$("chatLayout").classList.remove("hidden");$("profileForm").querySelector("button[type=submit]").textContent="ذخیره تغییرات پروفایل";$("myRole").innerHTML="نقش حساب: <b>"+esc(roleFa[role]||role)+"</b><br>نام کاربری: @"+esc(profile.username);await loadPeople();status("profileStatus","پروفایل ذخیره شد.");});
function setMode(m){mode=m;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));$("peoplePane").classList.toggle("hidden",m!=="people");$("groupsPane").classList.toggle("hidden",m!=="groups");$("sideProfile").classList.toggle("hidden",m!=="profile");}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$("editProfile").onclick=()=>{$("profileBox").classList.remove("hidden");$("profileBox").scrollIntoView({behavior:"smooth"})};
async function loadPeople(){const {data,error}=await db.from("ka_chat_profiles").select("user_id,display_name,username,bio,avatar_url").neq("user_id",me.id).order("display_name");if(error){$("peopleList").innerHTML='<div class="empty">دریافت افراد ناموفق بود؛ تنظیمات پایگاه داده را بررسی کن.</div>';return}const ids=(data||[]).map(x=>x.user_id);let roleMap={};if(ids.length){const {data:r}=await db.from("ka_profiles").select("id,role").in("id",ids);(r||[]).forEach(x=>roleMap[x.id]=x.role)}contacts=(data||[]).map(x=>({...x,role:roleMap[x.user_id]}));renderPeople()}
function renderPeople(){const q=$("search").value.trim().toLowerCase();const rows=contacts.filter(x=>(x.display_name+" "+x.username).toLowerCase().includes(q));$("peopleList").innerHTML="";if(!rows.length){$("peopleList").innerHTML='<div class="empty">کاربری با پروفایل تکمیل‌شده پیدا نشد.</div>';return}rows.forEach(x=>{const d=document.createElement("div");d.className="person"+(selected?.type==="dm"&&selected.id===x.user_id?" active":"");d.innerHTML="<b>"+esc(x.display_name)+"</b><span class='role'>"+esc(roleFa[x.role]||"کاربر")+"</span><small>@"+esc(x.username)+" · "+esc(x.bio||"بدون بیو")+"</small>";d.onclick=()=>openDM(x);$("peopleList").append(d)})}
$("search").oninput=renderPeople;
async function openDM(person){selected={type:"dm",id:person.user_id,person};$("chatTitle").textContent=person.display_name;$("chatSubtitle").textContent="@"+person.username+" · "+(roleFa[person.role]||"کاربر");$("groupManage").classList.add("hidden");$("messageInput").disabled=false;$("sendBtn").disabled=false;await loadMessages()}
async function loadMessages(){if(!selected)return;$("messages").innerHTML='<div class="empty">در حال دریافت پیام‌ها...</div>';let query;if(selected.type==="dm"){query=db.from("ka_chat_messages").select("id,sender_id,body,created_at").or("and(sender_id.eq."+me.id+",recipient_id.eq."+selected.id+"),and(sender_id.eq."+selected.id+",recipient_id.eq."+me.id+")").order("created_at")}else{query=db.from("ka_chat_group_messages").select("id,sender_id,body,created_at").eq("group_id",selected.id).order("created_at")}const {data,error}=await query.limit(150);if(error){$("messages").innerHTML='<div class="empty">پیام‌ها بارگذاری نشدند.</div>';status("chatStatus",error.message);return}const senderIds=[...new Set((data||[]).map(x=>x.sender_id))];let names={};if(senderIds.length){const {data:p}=await db.from("ka_chat_profiles").select("user_id,display_name").in("user_id",senderIds);(p||[]).forEach(x=>names[x.user_id]=x.display_name)}$("messages").innerHTML="";if(!data?.length)$("messages").innerHTML='<div class="empty">هنوز پیامی وجود ندارد. اولین پیام را بفرست!</div>';(data||[]).forEach(m=>{const d=document.createElement("div");d.className="msg"+(m.sender_id===me.id?" mine":"");d.textContent=m.body;const sm=document.createElement("small");sm.textContent=(m.sender_id===me.id?"شما":names[m.sender_id]||"کاربر")+" · "+new Date(m.created_at).toLocaleString("fa-IR");d.append(sm);$("messages").append(d)});$("messages").scrollTop=$("messages").scrollHeight}
$("sendForm").addEventListener("submit",async e=>{e.preventDefault();if(!selected)return;const body=$("messageInput").value.trim();if(!body)return;$("sendBtn").disabled=true;const row=selected.type==="dm"?{sender_id:me.id,recipient_id:selected.id,body}:{group_id:selected.id,sender_id:me.id,body};const {error}=await db.from(selected.type==="dm"?"ka_chat_messages":"ka_chat_group_messages").insert(row);if(error)status("chatStatus","ارسال انجام نشد: "+error.message);else{$("messageInput").value="";status("chatStatus","پیام ارسال شد.");await loadMessages()}$("sendBtn").disabled=false});
async function loadGroups(){const {data,error}=await db.from("ka_chat_group_members").select("group_id,ka_chat_groups(id,name,created_by)").eq("user_id",me.id);if(error){$("groupList").innerHTML='<div class="empty">دریافت گروه‌ها ناموفق بود.</div>';return}groups=(data||[]).map(x=>x.ka_chat_groups).filter(Boolean);$("groupList").innerHTML="";if(!groups.length)$("groupList").innerHTML='<div class="empty">هنوز عضو گروهی نیستی.</div>';groups.forEach(g=>{const d=document.createElement("div");d.className="person";d.innerHTML="<b>👥 "+esc(g.name)+"</b><small>گفت‌وگوی گروهی</small>";d.onclick=()=>openGroup(g);$("groupList").append(d)})}
async function openGroup(g){selected={type:"group",id:g.id,group:g};$("chatTitle").textContent="👥 "+g.name;$("chatSubtitle").textContent="گروه آکادمی شوالیه";$("groupManage").classList.remove("hidden");$("messageInput").disabled=false;$("sendBtn").disabled=false;await loadMessages()}
$("newGroup").onclick=async()=>{const name=prompt("نام گروه را بنویس:");if(!name?.trim())return;const {data,error}=await db.from("ka_chat_groups").insert({name:name.trim(),created_by:me.id}).select().single();if(error){status("chatStatus","ساخت گروه انجام نشد: "+error.message);return}const {error:memberError}=await db.from("ka_chat_group_members").insert({group_id:data.id,user_id:me.id,member_role:"owner"});if(memberError){status("chatStatus","گروه ساخته شد اما افزودن سازنده ناموفق بود: "+memberError.message);return}const names=prompt("نام‌های کاربری اعضا را با کاما وارد کن (بدون @). مثلاً arsin_5, teacher1:","");if(names?.trim()){const wanted=names.split(",").map(x=>x.trim().toLowerCase()).filter(Boolean);const rows=contacts.filter(x=>wanted.includes(x.username.toLowerCase())).map(x=>({group_id:data.id,user_id:x.user_id,member_role:"member"}));const {error:e}=await db.from("ka_chat_group_members").insert(rows);if(e)status("chatStatus","گروه ساخته شد؛ افزودن اعضا ناموفق بود: "+e.message);else if(rows.length!==wanted.length)status("chatStatus","گروه ساخته شد؛ بعضی نام‌های کاربری پیدا نشدند.")}await loadGroups();openGroup(data)};
$("groupManage").onclick=async()=>{if(!selected||selected.type!=="group")return;const names=prompt("نام‌های کاربری اعضای جدید را با کاما وارد کن (بدون @):");if(!names?.trim())return;const wanted=names.split(",").map(x=>x.trim().toLowerCase()).filter(Boolean);const rows=contacts.filter(x=>wanted.includes(x.username.toLowerCase())).map(x=>({group_id:selected.id,user_id:x.user_id,member_role:"member"}));if(!rows.length){status("chatStatus","هیچ‌کدام از نام‌های کاربری پیدا نشد.");return;}const {error}=await db.from("ka_chat_group_members").insert(rows);status("chatStatus",error?"افزودن عضو ناموفق بود: "+error.message:"اعضا اضافه شدند.");};
$("back").onclick=()=>{const destinations={student:"student.html",teacher:"teacher.html",admin:"admin.html",creator:"creator.html"};location.href=destinations[role]||"index.html"};
boot().catch(e=>{document.body.innerHTML="<p style='padding:30px;color:white'>خطا در راه‌اندازی پیام‌رسان: "+esc(e.message)+"</p>"});
</script></body></html>
